spring.application.name: uploader-service

server.servlet.context-path: /uploads
server.port: 9050

eureka.client.service-url.defaultZone: http://localhost:8761/eureka

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME}
  api-key: ${CLOUDINARY_API_KEY}
  api-secret: ${CLOUDINARY_API_SECRET}

gcloud:
  storage-bucket-name: ${GCLOUD_STORAGE_BUCKET_NAME}
  storage-access-key: >
    {
      "type": "service_account",
      "project_id": "${GCLOUD_PROJECT_ID}",
      "private_key_id": "${GCLOUD_PRIVATE_KEY_ID}",
      "private_key": "${GCLOUD_PRIVATE_KEY}",
      "client_email": "${GCLOUD_CLIENT_EMAIL}",
      "client_id": "${GCLOUD_CLIENT_ID}",
      "auth_uri": "https://accounts.google.com/o/oauth2/auth",
      "token_uri": "https://oauth2.googleapis.com/token",
      "auth_provider_x509_cert_url": "https://www.googleapis.com/oauth2/v1/certs",
      "client_x509_cert_url": "${GCLOUD_CLIENT_CERT_URL}",
      "universe_domain": "googleapis.com"
    }
